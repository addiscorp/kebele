name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Runs against the runner's Docker.
      - run: bun test
      # The published JavaScript runs on Node (and Simien), not only Bun:
      # built, packed and installed as a user gets it, then run against Docker.
      - run: bun run build
      - name: kebele on Node, installed from its package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          echo '{ "name": "app", "private": true }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/kebele-*.tgz
          node --version
          ./node_modules/.bin/kebele --version
          ./node_modules/.bin/kebele ls
